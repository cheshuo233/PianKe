# 胶片清单（唯一来源）。字段含义见 docs/superpowers/specs/2026-11-03-film-camera-design.md §4.1。
# 改了这里要重新烘焙：python tools/bake_films.py --toml films/films.toml --out app/src/main/assets/films.bin --json app/src/main/assets/films.json
#
# display 是界面上的名字（不带品牌前缀），iso 是整数，process 是 C-41 / ECN-2 / E-6 / K-14；name 照旧写进 films.bin。
# grain.strength 0..1；grain.size 是颗粒直径，单位是 768 px 短边下的像素，引擎按成片短边缩放。
# halation.radius 以高光图的格子为单位，高光图长边 96 格；halation.tint 是光晕颜色 [r, g, b]。
# 颗粒和光晕的数值是初始值，按观感调整，定稿以本文件为准。

# ---- negative：彩色负片 -> Kodak Portra Endura 相纸 ----

[[film]]
id = "portra160"
name = "Kodak Portra 160"
display = "Portra 160"
iso = 160
process = "C-41"
kind = "negative"
stock = "kodak_portra_160"
print = "kodak_portra_endura"
grain = { strength = 0.20, size = 1.0 }
halation = { strength = 0.10, radius = 5, tint = [255, 90, 40] }

