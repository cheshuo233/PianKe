      { name: 'Provia 100F', iso: '100', code: 'E-6', img: '/_blob/26cd0028fe3df388a7ba7de324e0f652', tint: 'rgba(90,140,220,0.06)', filter: 'saturate(1.1)' },
      { name: 'Ektachrome 100', iso: '100', code: 'E-6', img: '/_blob/7f402b9e0377870121ad2ec7ec558e8f', tint: 'rgba(80,140,220,0.12)', filter: 'saturate(1.15)' }
    ].map((f, k) => Object.assign({ nn: String(k + 1).padStart(2, '0') }, f));
  }
  // Drag along one axis. A tap (under 6px of travel) never captures the pointer,
  // so the buttons underneath still get their click; a real drag captures it.
  drag(key, axis, from, onStep, onEnd) {
    const pos = (e) => (axis === 'x' ? e.clientX : e.clientY);
    return {
      down: (e) => {
        if (!e || e.clientX === undefined) return;
        this[key] = { p: pos(e), v: from, cap: false, el: e.currentTarget, id: e.pointerId };
      },
      move: (e) => {
        const d = this[key];
        if (!d || !e) return;
        if (e.pointerType === 'mouse' && e.buttons === 0) { this[key] = null; if (d.cap) onEnd(); return; }
        const dp = pos(e) - d.p;
        if (!d.cap && Math.abs(dp) > 6) {
          d.cap = true;
          try { d.el.setPointerCapture(d.id); } catch (err) { /* capture is optional */ }
        }
        if (d.cap) onStep(d.v, dp);
      },
      up: () => { const d = this[key]; this[key] = null; if (d && d.cap) onEnd(); },
      leave: () => { const d = this[key]; if (d && !d.cap) this[key] = null; }
    };
  }
  renderVals() {
    const st = this.state || {};
    const films = this.films();
    const n = films.length;
    const fan = 30;
    const t = st.t !== undefined ? st.t : 1;
    const i = ((t % n) + n) % n;
    const fd = st.fd || null;
    const v = fd ? fd.t0 - fd.dy / fd.px : t;
    // Dragging up brings the next film in from below, like scrolling a list.
    const scroll = (key, px) => this.drag(key, 'y', t,
      (t0, dy) => this.setState({ fd: { t0: t0, dy: dy, px: px }, t: t0 - Math.round(dy / px) }),
      () => this.setState({ fd: null }));
    const wdrag = scroll('_wd', 58);
    const ddrag = scroll('_dd', 26);
    const pickFilm = (j) => () => {
      let d = (((j - i) % n) + n) % n;
      if (d > n / 2) d -= n;
      if (d) this.setState({ t: t + d });
    };
    const ease = '0.32s cubic-bezier(0.2, 0.8, 0.2, 1)';
    const clamp = (x) => Math.max(0, Math.min(1, x));
    // The window is a fan of labels pivoting on the dial's axis: the current
    // label sits upright on top, its neighbours tilt one step either way and
    // show their corners. The dial turns by the same angle, as one part.
    const reel = {
      tr: fd ? 'none' : 'transform ' + ease + ', opacity ' + ease + ', filter ' + ease,
      items: films.map((f, j) => {
        const d = ((((j - v + n / 2) % n) + n) % n) - n / 2;
        const a = Math.abs(d);
        return {
          img: f.img, name: f.name,
          rot: -d * fan,
          z: Math.max(1, 20 - Math.round(a * 4)),
          op: clamp((2 - a) / 0.4),
          br: 1 - 0.3 * Math.min(a, 1),
          pick: pickFilm(j)
        };
      }),
      down: wdrag.down, move: wdrag.move, up: wdrag.up, leave: wdrag.leave
    };
    const dial = {
      rot: v * fan,
      tr: fd ? 'none' : 'transform ' + ease,
      next: () => this.setState({ t: t + 1 }),
      prev: () => this.setState({ t: t - 1 }),
      down: ddrag.down, move: ddrag.move, up: ddrag.up, leave: ddrag.leave
    };

    const stops = [
      { f: 18, x: '0.8×', note: '超广角', crop: false },
      { f: 23, x: '1×', note: '主摄', crop: false },
      { f: 28, x: '1.2×', note: '裁切', crop: false },
      { f: 35, x: '1.5×', note: '裁切', crop: false },
      { f: 50, x: '2.2×', note: '数码', crop: true },
      { f: 115, x: '5×', note: '长焦', crop: false },
      { f: 135, x: '5.9×', note: '裁切', crop: false },
      { f: 200, x: '8.7×', note: '数码', crop: true }
    ];
    const last = stops.length - 1;
    const zpx = 48;
    const zc = (v) => Math.max(0, Math.min(last, v));
    const z = st.z !== undefined ? st.z : 1;
    const zd = st.zd || null;
    const zdrag = this.drag('_zd', 'x', z,
      (z0, dx) => this.setState({ zd: { z0: z0, dx: dx }, z: zc(z0 - Math.round(dx / zpx)) }),
      () => this.setState({ zd: null }));
    const base = (k) => 172 - (k * zpx + 24);
    let offset = base(z);
    let knurl = -z * zpx;
    if (zd) {
      offset = Math.max(base(last), Math.min(base(0), base(zd.z0) + zd.dx));
      knurl = -zd.z0 * zpx + (offset - base(zd.z0));
    }
    const zs = stops[z];
    const zoom = { f: zs.f, x: zs.x, note: zs.note, scale: Math.min(3.2, Math.max(1, zs.f / 23)) };
    const native = [18, 23, 115];
    const ring = {
      offset: offset,
      knurl: knurl,
      tr: zd ? 'none' : 'transform 0.2s ease-out',
      ktr: zd ? 'none' : 'background-position 0.2s ease-out',
      wider: () => this.setState({ z: zc(z - 1) }),
      closer: () => this.setState({ z: zc(z + 1) }),
      down: zdrag.down, move: zdrag.move, up: zdrag.up, leave: zdrag.leave,
      stops: stops.map((s, k) => ({
        f: s.f,
        size: k === z ? 16 : 12,
        color: k === z ? '#FFFFFF' : (s.crop ? '#E0955E' : '#C8C8C3'),
        dot: native.indexOf(s.f) >= 0 ? '#E2742B' : 'rgba(0,0,0,0)',
        pick: () => this.setState({ z: k })
      }))
    };

    return {
      cur: films[i],
      dial: dial,
      reel: reel,
      zoom: zoom,
      ring: ring
    };
  }
}
</script>
